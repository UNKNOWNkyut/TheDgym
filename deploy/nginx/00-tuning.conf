server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
