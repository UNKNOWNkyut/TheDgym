services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgym_prod}
      POSTGRES_USER: ${POSTGRES_USER:-dgym_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dgym_user} -d $${POSTGRES_DB:-dgym_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dgym_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dgym_prod}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}
    volumes:
      - dgym_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://thedgym.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-thedgym.com}
      NGINX_ENVSUBST_FILTER: SITE_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  pgdata:
  dgym_uploads:
  certbot_conf:
  certbot_www:
