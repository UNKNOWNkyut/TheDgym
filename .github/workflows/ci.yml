name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend Tests (PostgreSQL 16 + SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dgym_test
          POSTGRES_USER: dgym_test
          POSTGRES_PASSWORD: dgym_test_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U dgym_test -d dgym_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-characters-long
      XENDIT_WEBHOOK_VERIFICATION_TOKEN: ci-test-xendit-verification-token
      DATABASE_URL: postgresql+asyncpg://dgym_test:dgym_test_password@127.0.0.1:5432/dgym_test
      TEST_DATABASE_URL: postgresql+asyncpg://dgym_test:dgym_test_password@127.0.0.1:5432/dgym_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -c "import xgboost, sklearn, asyncpg; print('Runtime imports OK')"
      - run: python verify_config.py
      - run: python verify_xendit_payments.py
      - run: python verify_security_and_scale.py
      - run: python verify_gym_workflows.py
      - name: Smoke-test first-admin bootstrap on PostgreSQL
        env:
          ADMIN_EMAIL: ci-admin@thedgym.com
          ADMIN_FULL_NAME: CI Admin
          ADMIN_PASSWORD: CiAdminStrongPassword123!
        run: python scripts/create_admin.py
